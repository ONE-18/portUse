<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PortUse · Inventarios</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">⌘</span><div><strong>PortUse</strong><small>inventarios de infraestructura</small></div></div>
        <label class="upload-button">+ Cargar JSON<input id="file-input" type="file" accept=".json,application/json"></label>
      </header>
      <section class="hero">
        <div><p class="eyebrow">CENTRO DE CONTROL</p><h1>Visualiza la evolución<br><em>de tus contenedores.</em></h1><p class="intro">Carga snapshots JSON, inspecciona el estado más reciente y detecta cambios entre dos momentos.</p></div>
        <div class="hero-orb"><span>PORT<br>USE</span></div>
      </section>
      <div id="notice" class="notice" hidden></div>
      <section class="toolbar">
        <div><h2>Snapshots</h2><span id="snapshot-count" class="muted"></span></div>
        <div class="compare-controls"><select id="from-select" aria-label="Snapshot anterior"></select><span>→</span><select id="to-select" aria-label="Snapshot actual"></select><button id="compare-button" class="secondary">Comparar</button></div>
      </section>
      <section id="snapshot-list" class="snapshot-list"></section>
      <section id="detail" class="detail" hidden></section>
      <section id="comparison" class="comparison" hidden></section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>

services:
  portuse:
    build:
      context: .
    image: portuse:latest
    container_name: portuse
    restart: unless-stopped
    ports:
      - "${PORTUSE_PORT:-8000}:8000"
    volumes:
      - portuse-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  portuse-data:
